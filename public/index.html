<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>牢房糧食爭奪戰</title>
  <!-- 引入 Socket.io 及 QRCode 產生套件 -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1, h2, h3 { margin-top: 0; }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    .hidden { display: none !important; }
    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
      width: 100%;
      margin-top: 10px;
    }
    button:hover { background-color: var(--accent-hover); }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px 0;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
    }
    .character-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
    .character-option {
      background: #334155;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .character-option.selected {
      border-color: var(--accent);
      background: #1d4ed8;
    }
    .player-list-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      background: #334155;
      margin-bottom: 6px;
      border-radius: 6px;
    }
    #qrcode-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 15px 0;
      background: white;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>🔒 牢房糧食爭奪戰</h1>

  <!-- 首頁：選擇身份 -->
  <div id="screen-home" class="container">
    <h2>歡迎進入遊戲</h2>
    <p style="color: var(--text-muted);">請選擇你的身份：</p>
    <button onclick="showHostSetup()">我是主持人 (Host)</button>
    <button onclick="showPlayerJoin()" style="background-color: #10b981; margin-top: 15px;">我是玩家 (Player)</button>
  </div>

  <!-- 主持人：大廳設定 -->
  <div id="screen-host-setup" class="container hidden">
    <h2>主持人控制面板</h2>
    <button onclick="createRoom()">建立新房間</button>
    <div id="host-room-info" class="hidden" style="margin-top: 20px;">
      <h3 style="color: var(--success);">房間代碼: <span id="display-room-code" style="font-size: 28px; color: white;"></span></h3>
      
      <!-- QR Code 區塊 (第 1 回合或未開始時顯示) -->
      <div id="qr-section">
        <p>請玩家掃描以下 QR Code 加入遊戲：</p>
        <div id="qrcode-container">
          <div id="qrcode"></div>
        </div>
      </div>

      <h3>已加入玩家 (<span id="player-count">0</span>):</h3>
      <div id="host-player-list" style="max-height: 150px; overflow-y: auto; margin-bottom: 15px;"></div>
      
      <button id="btn-start-round" onclick="startNextRound()" style="background-color: #8b5cf6;">開始第 1 回合</button>
    </div>
  </div>

  <!-- 玩家：加入房間 -->
  <div id="screen-player-join" class="container hidden">
    <h2>加入遊戲房間</h2>
    <label>房間代碼 (4位數字):</label>
    <input type="text" id="input-room-code" placeholder="例如: 5821" maxlength="4">
    
    <label>你的名字:</label>
    <input type="text" id="input-player-name" placeholder="輸入你的稱呼">

    <label>選擇你的角色 (自動鎖定對應牢房):</label>
    <div class="character-grid" id="character-selection-grid">
      <div class="character-option" onclick="selectCharacter(1, '拉不拉卡', '1號牢房')">拉不拉卡<br><small>1號牢房</small></div>
      <div class="character-option" onclick="selectCharacter(2, '孫旺財', '2號牢房')">孫旺財<br><small>2號牢房</small></div>
      <div class="character-option" onclick="selectCharacter(3, '唐三角', '3號牢房')">唐三角<br><small>3號牢房</small></div>
      <div class="character-option" onclick="selectCharacter(4, '雲蘇', '4號牢房')">雲蘇<br><small>4號牢房</small></div>
      <div class="character-option" onclick="selectCharacter(5, '王元鵝', '5號牢房')">王元鵝<br><small>5號牢房</small></div>
      <div class="character-option" onclick="selectCharacter(6, '諸葛帥坤', '6號牢房')">諸葛帥坤<br><small>6號牢房</small></div>
      <div class="character-option" onclick="selectCharacter(7, '小程', '7號牢房')">小程<br><small>7號牢房</small></div>
      <div class="character-option" onclick="selectCharacter(8, '李小白', '8號牢房')">李小白<br><small>8號牢房</small></div>
    </div>

    <button onclick="joinRoom()">確認加入房間</button>
  </div>

  <!-- 玩家：等待大廳 / 遊戲面板 -->
  <div id="screen-player-game" class="container hidden">
    <h2>等待遊戲開始</h2>
    <div id="player-status-box" style="background: #334155; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px;">
      <h3 id="player-info-display">角色載入中...</h3>
      <p id="player-cell-display" style="color: #60a5fa; font-weight: bold;"></p>
    </div>

    <div id="round-dispatch-section" class="hidden">
      <h3 id="current-round-title">第 1 回合佈署</h3>
      <p id="event-description" style="color: #facc15; font-weight: bold;"></p>
      <p id="disabled-minion-notice" style="color: var(--danger); font-weight: bold;"></p>

      <p>請將你的 4 位手下（m1~m4）分配到目標牢房編號：</p>
      <div id="minion-selectors"></div>
      <button onclick="submitMinions()" style="background-color: var(--success);">確認提交陣容</button>
    </div>
  </div>

  <!-- 主持人：回合進行與戰況面板 -->
  <div id="screen-host-game" class="container hidden">
    <h2 id="host-game-title">回合進行中</h2>
    <p id="host-event-desc" style="color: #facc15; font-weight: bold;"></p>
    <div style="background: #334155; padding: 12px; border-radius: 8px; margin-bottom: 15px;">
      <p>🎯 本回合機密 Bonus 牢房：<span id="host-bonus-cell" style="color: #facc15; font-size: 20px; font-weight: bold;">?</span> 號</p>
      <p>📦 玩家提交進度：<span id="submitted-status-count">0</span> / <span id="submitted-total-count">0</span></p>
    </div>
    <button id="btn-calculate" onclick="triggerCalculate()" style="background-color: var(--danger);" disabled>執行本回合結算</button>
  </div>

  <!-- 結算結果顯示面板 -->
  <div id="screen-result" class="container hidden">
    <h2>⚖️ 回合結算結果</h2>
    <div id="result-content"></div>
    <div id="tie-resolution-box" class="hidden" style="margin-top: 15px; background: #334155; padding: 12px; border-radius: 8px;">
      <h3>平手裁決區</h3>
      <div id="tie-containers"></div>
    </div>
    <button id="btn-next-round" onclick="startNextRound()" style="margin-top: 15px; background-color: var(--accent);">進入下一回合</button>
  </div>

  <!-- 最終結算面板 -->
  <div id="screen-game-over" class="container hidden">
    <h2>🏆 遊戲最終結算排行榜</h2>
    <div id="leaderboard-content"></div>
  </div>

  <script>
    const socket = io();

    let currentRoomCode = '';
    let selectedCharacterId = null;
    let selectedCharacterName = '';
    let selectedCellNo = null;
    let myPlayerId = '';
    let maxRounds = 4;
    let currentRound = 0;
    let disabledMinionPower = null;

    function showHostSetup() {
      document.getElementById('screen-home').classList.add('hidden');
      document.getElementById('screen-host-setup').classList.remove('hidden');
    }

    function showPlayerJoin() {
      document.getElementById('screen-home').classList.add('hidden');
      document.getElementById('screen-player-join').classList.remove('hidden');
      socket.emit('checkTakenCharacters', currentRoomCode);
    }

    function createRoom() {
      socket.emit('createRoom');
    }

    socket.on('roomCreated', ({ roomId, maxRounds: mr }) => {
      currentRoomCode = roomId;
      maxRounds = mr;
      document.getElementById('display-room-code').innerText = roomId;
      document.getElementById('host-room-info').classList.remove('hidden');

      // 產生 QR Code
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      const joinUrl = `${window.location.origin}/?room=${roomId}`;
      new QRCode(qrContainer, {
        text: joinUrl,
        width: 160,
        height: 160
      });
    });

    function selectCharacter(id, name, cellDesc) {
      selectedCharacterId = id;
      selectedCharacterName = name;
      
      document.querySelectorAll('.character-option').forEach(el => el.classList.remove('selected'));
      event.currentTarget.classList.add('selected');
    }

    function joinRoom() {
      const roomCodeInput = document.getElementById('input-room-code').value.trim();
      const playerName = document.getElementById('input-player-name').value.trim();

      if (!roomCodeInput || !playerName || !selectedCharacterId) {
        alert('請填寫房間代碼、名字並選擇角色！');
        return;
      }

      currentRoomCode = roomCodeInput;
      socket.emit('joinRoom', {
        roomId: currentRoomCode,
        characterId: selectedCharacterId,
        playerName: playerName,
        characterAvatar: 'default'
      });
    }

    socket.on('errorMessage', (msg) => {
      alert(msg);
    });

    socket.on('joinSuccess', ({ roomId, playerName, characterAvatar, cellNo, maxRounds: mr }) => {
      maxRounds = mr;
      myPlayerId = socket.id;
      selectedCellNo = cellNo;

      document.getElementById('screen-player-join').classList.add('hidden');
      document.getElementById('screen-player-game').classList.remove('hidden');
      document.getElementById('player-info-display').innerText = `玩家：${playerName} (${selectedCharacterName})`;
      document.getElementById('player-cell-display').innerText = `🔒 你所屬的固定牢房：${cellNo} 號`;
    });

    socket.on('updatePlayers', (players) => {
      const listEl = document.getElementById('host-player-list');
      const countEl = document.getElementById('player-count');
      if (!listEl) return;

      countEl.innerText = players.length;
      listEl.innerHTML = players.map(p => `
        <div class="player-list-item">
          <span>${p.name} (${p.characterId ? '角色#' + p.characterId : ''})</span>
          <span>牢房: <b>${p.cellNo}號</b> | 積分: ${p.totalScore}</span>
        </div>
      `).join('');
    });

    // 回合開始
    socket.on('roundStarted', ({ round, maxRounds, totalCells, eventInfo }) => {
      currentRound = round;
      
      // 主持人在第 2 回合或以後自動隱藏 QR Code
      if (round > 1) {
        const qrSec = document.getElementById('qr-section');
        if (qrSec) qrSec.classList.add('hidden');
      }

      // 切換到遊戲畫面
      document.getElementById('screen-host-setup').classList.add('hidden');
      document.getElementById('screen-result').classList.add('hidden');
      if (socket.id === document.getElementById('display-room-code') ? false : true) {
        // 主持人視角
      }
      
      // 判斷當前是主持人還是玩家
      if (document.getElementById('screen-host-setup').classList.contains('hidden') && myPlayerId === '') {
        // 主持人
      } else {
        // 玩家畫面
        document.getElementById('round-dispatch-section').classList.remove('hidden');
        document.getElementById('current-round-title').innerText = `第 ${round} 回合佈署 (共 ${maxRounds} 回合)`;
        document.getElementById('event-description').innerText = eventInfo.description;
      }
    });

    socket.on('playerRoundConfig', ({ disabledMinion }) => {
      disabledMinionPower = disabledMinion;
      const noticeEl = document.getElementById('disabled-minion-notice');
      const selectorsEl = document.getElementById('minion-selectors');
      selectorsEl.innerHTML = '';

      if (disabledMinion) {
        noticeEl.innerText = `🚫 兵力受阻事件：你的手下 ${disabledMinion}（戰力 ${disabledMinion}）本回合被封印，無法派遣！`;
      } else {
        noticeEl.innerText = '';
      }

      // 產生 4 位手下 (m1 ~ m4) 的分配下拉選單
      for (let i = 1; i <= 4; i++) {
        const isDisabled = (disabledMinion === i);
        selectorsEl.innerHTML += `
          <div style="margin-bottom: 10px;">
            <label>手下 ${i} (戰力 ${i}) ${isDisabled ? '<span style="color:red;">[已封印]</span>' : ''} -> 派遣至牢房編號：</label>
            <select id="m${i}" ${isDisabled ? 'disabled style="background:#555;"' : ''}>
              ${generateCellOptions()}
            </select>
          </div>
        `;
      }
    });

    function generateCellOptions() {
      // 預設提供 1~8 號牢房選項供玩家選擇目標
      let opts = '';
      for (let i = 1; i <= 8; i++) {
        opts += `<option value="${i}">第 ${i} 號牢房</option>`;
      }
      return opts;
    }

    function submitMinions() {
      const dispatchMap = {};
      for (let i = 1; i <= 4; i++) {
        if (disabledMinionPower === i) continue; // 略過被封印手下
        const selectEl = document.getElementById(`m${i}`);
        if (selectEl) {
          dispatchMap[i] = parseInt(selectEl.value);
        }
      }

      socket.emit('submitMinions', { roomId: currentRoomCode, dispatchMap });
      alert('陣容已成功提交！請等待主持人結算。');
      document.getElementById('round-dispatch-section').classList.add('hidden');
    }

    // 主持人收到玩家提交通知
    socket.on('hostBonusNotice', ({ bonusCell, submittedCount, totalPlayers }) => {
      document.getElementById('screen-host-setup').classList.add('hidden');
      document.getElementById('screen-host-game').classList.remove('hidden');
      document.getElementById('host-bonus-cell').innerText = bonusCell;
      document.getElementById('submitted-status-count').innerText = submittedCount;
      document.getElementById('submitted-total-count').innerText = totalPlayers;
      document.getElementById('btn-calculate').disabled = false;
    });

    socket.on('playerSubmittedNotice', ({ submittedCount, totalPlayers }) => {
      const countEl = document.getElementById('submitted-status-count');
      if (countEl) countEl.innerText = submittedCount;
    });

    function triggerCalculate() {
      socket.emit('triggerCalculateResults', { roomId: currentRoomCode });
    }

    socket.on('roundRevealed', ({ round, maxRounds, isLastRound, summary, tiesToResolve }) => {
      document.getElementById('screen-host-game').classList.add('hidden');
      document.getElementById('screen-result').classList.remove('hidden');

      const contentEl = document.getElementById('result-content');
      let html = `<h3>第 ${round} 回合結算明細</h3>`;

      Object.entries(summary).forEach(([cellNo, data]) => {
        html += `
          <div style="background:#334155; padding:10px; margin-bottom:8px; border-radius:6px;">
            <p><b>${cellNo} 號牢房</b> ${data.isDouble ? '<span style="color:#facc15;">[🔥 雙倍糧食]</span>' : ''}</p>
            <p>本局總爭奪糧食：${data.points} 分</p>
            <p>結算狀態：<span style="color:var(--success); font-weight:bold;">${data.winnerName || '無得主'}</span></p>
          </div>
        `;
      });

      contentEl.innerHTML = html;

      // 處理平手裁決
      const tieBox = document.getElementById('tie-resolution-box');
      const tieContainers = document.getElementById('tie-containers');
      if (tiesToResolve && tiesToResolve.length > 0) {
        tieBox.classList.remove('hidden');
        tieContainers.innerHTML = tiesToResolve.map(t => `
          <p>${t.cellNo} 號牢房平手 (${t.points}分)，請主持人裁決贏家：</p>
          ${t.tiedPlayers.map(p => `<button onclick="resolveTie('${t.cellNo}', '${p.id}')">${p.name}</button>`).join('')}
        `).join('');
      } else {
        tieBox.classList.add('hidden');
      }

      if (isLastRound) {
        document.getElementById('btn-next-round').innerText = '查看最終排行榜';
        document.getElementById('btn-next-round').setAttribute('onclick', 'showFinalLeaderboard()');
      }
    });

    function resolveTie(cellNo, winnerPlayerId) {
      socket.emit('resolveTie', { roomId: currentRoomCode, cellNo, winnerPlayerId });
    }

    socket.on('tieResolved', ({ cellNo, winnerName }) => {
      alert(`已成功裁決 ${cellNo} 號牢房由 ${winnerName} 獲勝！`);
      document.getElementById('tie-resolution-box').classList.add('hidden');
    });

    function showFinalLeaderboard() {
      socket.emit('startNextRound', { roomId: currentRoomCode }); // 觸發後端結束判定
    }

    socket.on('gameOver', ({ message, leaderboard }) => {
      document.getElementById('screen-result').classList.add('hidden');
      document.getElementById('screen-game-over').classList.remove('hidden');

      const lbEl = document.getElementById('leaderboard-content');
      lbEl.innerHTML = `<h3>${message}</h3>` + leaderboard.map((p, index) => `
        <div class="player-list-item" style="font-size: 18px; margin-bottom: 8px;">
          <span>#${index + 1} ${p.name} (${p.characterId ? '角色#' + p.characterId : ''})</span>
          <b style="color: #facc15;">${p.totalScore} 分</b>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
