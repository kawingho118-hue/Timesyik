<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>牢房糧食爭奪戰</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
    body { background: #121214; color: #e1e1e6; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; background: #202024; border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h1, h2, h3 { text-align: center; color: #00e676; margin-top: 0; }
    .btn { width: 100%; background: #04d361; color: #000; font-weight: bold; border: none; padding: 14px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .btn:hover { background: #00e676; }
    .btn:disabled { background: #4d4d57; color: #8d8d99; cursor: not-allowed; }
    .btn-secondary { background: #323238; color: #fff; }
    .btn-secondary:hover { background: #4d4d57; }
    input, select { width: 100%; padding: 12px; background: #121214; border: 1px solid #323238; color: #fff; border-radius: 6px; font-size: 16px; margin-bottom: 12px; }
    .grid-select { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .card-option { background: #29292e; border: 2px solid #323238; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
    .card-option.selected { border-color: #04d361; background: #123927; }
    .card-option.disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }
    .card-option img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-bottom: 6px; }
    .status-card { background: #29292e; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .minion-input-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; background: #121214; padding: 8px 12px; border-radius: 6px; }
    .leaderboard-list { list-style: none; padding: 0; }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #323238; }
    .notice-box { background: #3d2b00; border: 1px solid #ffbb00; color: #ffeb99; padding: 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 1. 模式選擇頁面 -->
    <div id="view-landing">
      <h1>牢房糧食爭奪戰</h1>
      <button class="btn" onclick="showHostSetup()">我是主持人 (建立房間)</button>
      <button class="btn btn-secondary" onclick="showPlayerJoin()">我是玩家 (加入房間)</button>
    </div>

    <!-- 2. 主持人設定頁 -->
    <div id="view-host-setup" style="display:none;">
      <h2>主持人建立房間</h2>
      <button class="btn" onclick="createRoom()">產生房間代碼</button>
      <button class="btn btn-secondary" onclick="showLanding()">返回</button>
    </div>

    <!-- 3. 玩家加入頁 -->
    <div id="view-player-join" style="display:none;">
      <h2>玩家加入</h2>
      <input type="text" id="input-room-code" placeholder="請輸入 4 位數房間 Code" maxlength="4">
      <h3>選擇你的角色：</h3>
      <div class="grid-select" id="character-selector"></div>
      <button class="btn" id="btn-join" onclick="joinRoom()" disabled>確認加入</button>
      <button class="btn btn-secondary" onclick="showLanding()">返回</button>
    </div>

    <!-- 4. 主持人控制台 -->
    <div id="view-host-panel" style="display:none;">
      <h2>主持人控制台</h2>
      <div class="status-card">
        <div>房間 Code: <strong id="host-room-id" style="color:#04d361; font-size:20px;">----</strong></div>
        <div>當前回合: <span id="host-round-info">等待開始...</span></div>
        <div>已加入玩家數: <span id="host-player-count">0</span></div>
      </div>
      
      <div id="host-bonus-notice" class="notice-box" style="display:none;"></div>
      <div id="host-submit-progress" class="status-card" style="display:none;">
        已提交玩家：<span id="submitted-count">0</span> / <span id="total-players-count">0</span>
      </div>

      <button class="btn" id="btn-host-next-round" onclick="hostStartNextRound()">發布/開始下一回合</button>
      <button class="btn btn-secondary" id="btn-host-calc" onclick="hostCalculateResults()" style="display:none;">計算並公佈本回合戰果</button>

      <div id="host-results-area" style="margin-top: 16px;"></div>
      
      <h3>目前玩家總分排行榜</h3>
      <ul class="leaderboard-list" id="host-leaderboard"></ul>
    </div>

    <!-- 5. 玩家遊戲主頁面 -->
    <div id="view-player-panel" style="display:none;">
      <div class="status-card" style="display:flex; align-items:center; gap:12px;">
        <img id="player-my-avatar" src="" style="width:50px; height:50px; border-radius:50%;">
        <div>
          <h3 id="player-my-name" style="margin:0; text-align:left;"></h3>
          <small>牢房號碼：<span id="player-my-cell" style="color:#04d361;"></span> 號</small>
        </div>
      </div>

      <div class="status-card">
        <div>當前回合：<strong id="player-round-display">--</strong></div>
        <div id="player-event-desc" style="color:#ffbb00; margin-top:4px; font-size:14px;"></div>
      </div>

      <div id="player-action-area" style="display:none;">
        <h3>派遣手下前往牢房：</h3>
        <form id="minion-form">
          <div id="minion-inputs-container"></div>
          <button type="button" class="btn" id="btn-submit-minions" onclick="submitMinions()">提交兵力分配</button>
        </form>
      </div>

      <div id="player-waiting-msg" style="display:none; text-align:center; padding:20px; color:#8d8d99;">
        已成功提交！等待主持人結算結果...
      </div>

      <div id="player-results-area" style="margin-top:16px;"></div>

      <h3>目前總分排行榜</h3>
      <ul class="leaderboard-list" id="player-leaderboard"></ul>
    </div>
  </div>

  <script>
    const socket = io();

    const CHARACTERS = [
      { id: 1, cellNo: 1, name: '拉不拉卡', avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=1' },
      { id: 2, cellNo: 2, name: '孫旺財', avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=2' },
      { id: 3, cellNo: 3, name: '雲蘇', avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=3' },
      { id: 4, cellNo: 4, name: '唐三角', avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=4' },
      { id: 5, cellNo: 5, name: '諸葛帥坤', avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=5' },
      { id: 6, cellNo: 6, name: '王元鵝', avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=6' },
      { id: 7, cellNo: 7, name: '小程', avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=7' },
      { id: 8, cellNo: 8, name: '李小白', avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=8' }
    ];

    let currentRoomId = null;
    let selectedCharacter = null;
    let takenCharacters = [];
    let currentTotalCells = 0;
    let latestPlayersData = [];

    function hideAllViews() {
      document.querySelectorAll('.container > div').forEach(div => div.style.display = 'none');
    }

    function showLanding() { hideAllViews(); document.getElementById('view-landing').style.display = 'block'; }
    function showHostSetup() { hideAllViews(); document.getElementById('view-host-setup').style.display = 'block'; }
    function showPlayerJoin() { 
      hideAllViews(); 
      document.getElementById('view-player-join').style.display = 'block'; 
      renderCharacterSelector();
    }

    document.getElementById('input-room-code').addEventListener('input', (e) => {
      const code = e.target.value.trim();
      if (code.length === 4) {
        socket.emit('checkTakenCharacters', code);
      }
    });

    socket.on('updateTakenCharacters', (takenList) => {
      takenCharacters = takenList;
      renderCharacterSelector();
    });

    function renderCharacterSelector() {
      const container = document.getElementById('character-selector');
      container.innerHTML = '';
      CHARACTERS.forEach(c => {
        const isTaken = takenCharacters.includes(c.id);
        const card = document.createElement('div');
        card.className = `card-option ${isTaken ? 'disabled' : ''} ${selectedCharacter?.id === c.id ? 'selected' : ''}`;
        card.innerHTML = `
          <img src="${c.avatar}">
          <div style="font-weight:bold;">${c.name}</div>
          <small style="color:#8d8d99;">(${c.cellNo}號牢房)</small>
        `;
        if (!isTaken) {
          card.onclick = () => {
            selectedCharacter = c;
            renderCharacterSelector();
            document.getElementById('btn-join').disabled = false;
          };
        }
        container.appendChild(card);
      });
    }

    function createRoom() { socket.emit('createRoom'); }

    socket.on('roomCreated', ({ roomId }) => {
      currentRoomId = roomId;
      hideAllViews();
      document.getElementById('view-host-panel').style.display = 'block';
      document.getElementById('host-room-id').innerText = roomId;
    });

    function joinRoom() {
      const code = document.getElementById('input-room-code').value.trim();
      if (!code || !selectedCharacter) return;
      socket.emit('joinRoom', {
        roomId: code,
        characterId: selectedCharacter.id,
        playerName: selectedCharacter.name,
        characterAvatar: selectedCharacter.avatar
      });
    }

    socket.on('joinSuccess', ({ roomId, playerName, characterAvatar, cellNo }) => {
      currentRoomId = roomId;
      hideAllViews();
      document.getElementById('view-player-panel').style.display = 'block';
      document.getElementById('player-my-name').innerText = playerName;
      document.getElementById('player-my-avatar').src = characterAvatar;
      document.getElementById('player-my-cell').innerText = cellNo;
    });

    socket.on('errorMessage', (msg) => { alert(msg); });

    socket.on('updatePlayers', (players) => {
      latestPlayersData = players;
      document.getElementById('host-player-count').innerText = players.length;
      updateLeaderboardDisplay('host-leaderboard', players);
      updateLeaderboardDisplay('player-leaderboard', players);
    });

    function updateLeaderboardDisplay(elementId, players) {
      const list = document.getElementById(elementId);
      if (!list) return;
      list.innerHTML = '';
      const sorted = [...players].sort((a, b) => b.totalScore - a.totalScore);
      sorted.forEach((p, index) => {
        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        li.innerHTML = `
          <span>#${index + 1} ${p.name} (${p.cellNo}號牢房)</span>
          <strong style="color:#04d361;">${p.totalScore} 分</strong>
        `;
        list.appendChild(li);
      });
    }

    function hostStartNextRound() {
      if (!currentRoomId) return;
      document.getElementById('host-results-area').innerHTML = '';
      document.getElementById('btn-host-next-round').style.display = 'none';
      document.getElementById('btn-host-calc').style.display = 'block';
      document.getElementById('btn-host-calc').disabled = false;
      socket.emit('startNextRound', { roomId: currentRoomId });
    }

    socket.on('hostBonusNotice', ({ bonusCell, submittedCount, totalPlayers }) => {
      const noticeBox = document.getElementById('host-bonus-notice');
      noticeBox.style.display = 'block';
      noticeBox.innerHTML = `🎲 <strong>本回合隨機 200 分 Bonus 牢房：</strong> 牢房 ${bonusCell} 號`;
      
      document.getElementById('host-submit-progress').style.display = 'block';
      document.getElementById('submitted-count').innerText = submittedCount;
      document.getElementById('total-players-count').innerText = totalPlayers;
    });

    socket.on('playerSubmittedNotice', ({ submittedCount, totalPlayers }) => {
      document.getElementById('submitted-count').innerText = submittedCount;
      document.getElementById('total-players-count').innerText = totalPlayers;
    });

    socket.on('roundStarted', ({ round, maxRounds, totalCells, eventInfo }) => {
      currentTotalCells = totalCells;
      document.getElementById('host-round-info').innerText = `第 ${round} / ${maxRounds} 回合 (${eventInfo.description})`;
      document.getElementById('player-round-display').innerText = `第 ${round} / ${maxRounds} 回合`;
      document.getElementById('player-event-desc').innerText = eventInfo.description;

      document.getElementById('player-action-area').style.display = 'block';
      document.getElementById('player-waiting-msg').style.display = 'none';
      document.getElementById('player-results-area').innerHTML = '';
      document.getElementById('btn-submit-minions').disabled = false;
    });

    socket.on('playerRoundConfig', ({ disabledMinion }) => {
      const container = document.getElementById('minion-inputs-container');
      container.innerHTML = '';
      for (let power = 1; power <= 4; power++) {
        const div = document.createElement('div');
        div.className = 'minion-input-group';
        
        if (disabledMinion === power) {
          div.innerHTML = `
            <span>手下 ${power} (戰力 ${power})</span>
            <span style="color:#ff4d4d; font-weight:bold;">🚫 本回合受阻無法出戰</span>
          `;
        } else {
          let selectHtml = `<select name="minion_${power}">`;
          for (let c = 1; c <= currentTotalCells; c++) {
            selectHtml += `<option value="${c}">前往 ${c} 號牢房</option>`;
          }
          selectHtml += `</select>`;
          div.innerHTML = `<span>手下 ${power} (戰力 ${power})</span> ${selectHtml}`;
        }
        container.appendChild(div);
      }
    });

    function submitMinions() {
      const form = document.getElementById('minion-form');
      const formData = new FormData(form);
      const dispatchMap = {};
      
      for (let [key, val] of formData.entries()) {
        const minionPower = key.split('_')[1];
        dispatchMap[minionPower] = parseInt(val);
      }

      socket.emit('submitMinions', { roomId: currentRoomId, dispatchMap });
      document.getElementById('player-action-area').style.display = 'none';
      document.getElementById('player-waiting-msg').style.display = 'block';
    }

    function hostCalculateResults() {
      document.getElementById('btn-host-calc').disabled = true;
      socket.emit('triggerCalculateResults', { roomId: currentRoomId });
    }

    socket.on('roundRevealed', ({ round, maxRounds, isLastRound, bonusCell, totalCells, summary, players, tiesToResolve }) => {
      document.getElementById('host-submit-progress').style.display = 'none';
      document.getElementById('host-bonus-notice').style.display = 'none';
      
      const hostArea = document.getElementById('host-results-area');
      const playerArea = document.getElementById('player-results-area');

      let html = `<div class="status-card"><h3>第 ${round} 回合戰況結算</h3>`;
      
      for (let c = 1; c <= totalCells; c++) {
        const item = summary[c];
        let bonusText = (c === bonusCell) ? ' <span style="color:#ffbb00;">(200分Bonus)</span>' : '';
        let doubleText = item.isDouble ? ' <span style="color:#ff4d4d; font-weight:bold;">[戰力最高倍增 x2!]</span>' : '';
        
        html += `<div style="border-bottom: 1px solid #323238; padding:8px 0;">`;
        html += `<div><strong>${c} 號牢房</strong> (本回合糧食: ${item.points}分${bonusText}${doubleText})</div>`;

        if (item.details.length === 0) {
          html += `<small style="color:#8d8d99;">無玩家派遣手下進駐 (糧食累積至下一回合)</small>`;
        } else {
          html += `<small style="color:#8d8d99;">進駐情況: `;
          item.details.forEach(d => {
            html += `${d.playerName}(戰力${d.power}) `;
          });
          html += `</small><br>`;

          if (item.status === 'WIN') {
            html += `<span style="color:#04d361;">🏆 贏家: ${item.winnerName}</span>`;
          } else if (item.status === 'TIE') {
            html += `<span style="color:#ffbb00;">⚖️ 發生平手爭奪！</span>`;
          }
        }
        html += `</div>`;
      }
      html += `</div>`;

      playerArea.innerHTML = html;

      // 主持人端可額外顯示平手手動裁決控制
      if (tiesToResolve && tiesToResolve.length > 0) {
        html += `<div class="notice-box"><h3>⚖️ 平手手動裁決區</h3>`;
        tiesToResolve.forEach(tie => {
          html += `<div style="margin-bottom:10px;" id="tie-control-${tie.cellNo}">`;
          html += `<div>⚖️ <strong>${tie.cellNo} 號牢房</strong> 發生平手（總分 ${tie.points} 分），請主持人手動裁決贏家：</div>`;
          html += `<select id="tie-winner-select-${tie.cellNo}">`;
          tie.tiedPlayers.forEach(tp => {
            html += `<option value="${tp.id}">${tp.name} (${tp.cellNo} 號牢房)</option>`;
          });
          html += `</select>`;
          // 💡 此處已修改按鈕文字為「決定分數」，並傳送最新分數
          html += `<button class="btn" onclick="resolveTie(${tie.cellNo})">決定分數</button>`;
          html += `</div>`;
        });
        html += `</div>`;
      }

      html += `<button class="btn" style="background:#04d361; margin-top:12px;" onclick="publishUpdatedScores()">🔄 更新並發布最新分數</button>`;

      hostArea.innerHTML = html;

      if (!isLastRound) {
        document.getElementById('btn-host-next-round').innerText = `開始第 ${round + 1} 回合`;
        document.getElementById('btn-host-next-round').style.display = 'block';
        document.getElementById('btn-host-calc').style.display = 'none';
      } else {
        document.getElementById('btn-host-next-round').style.display = 'none';
        document.getElementById('btn-host-calc').style.display = 'none';
      }
    });

    function resolveTie(cellNo) {
      const select = document.getElementById(`tie-winner-select-${cellNo}`);
      const winnerPlayerId = select.value;
      socket.emit('resolveTie', { roomId: currentRoomId, cellNo, winnerPlayerId });
      
      const tieControlDiv = document.getElementById(`tie-control-${cellNo}`);
      if (tieControlDiv) {
        tieControlDiv.innerHTML = `<span style="color:#04d361;">✅ 已成功決定 ${cellNo} 號牢房贏家！</span>`;
      }
    }

    // 💡 點擊「更新並發佈最新分數」：即時讓主持人與玩家端更新排行榜，不跳出 alert
    function publishUpdatedScores() {
      socket.emit('publishUpdatedScores', { roomId: currentRoomId });
    }

    socket.on('tieResolved', ({ cellNo, winnerName, players }) => {
      latestPlayersData = players;
      updateLeaderboardDisplay('host-leaderboard', players);
      updateLeaderboardDisplay('player-leaderboard', players);
    });

    socket.on('gameOver', ({ message, leaderboard }) => {
      let resultHtml = `<div class="status-card" style="text-align:center;">`;
      resultHtml += `<h2>🎉 遊戲結束！</h2>`;
      resultHtml += `<p>${message}</p>`;
      resultHtml += `<h3>🏆 最終排行榜</h3>`;
      leaderboard.forEach((p, idx) => {
        resultHtml += `<div>#${idx + 1} ${p.name} - <strong>${p.totalScore} 分</strong></div>`;
      });
      resultHtml += `</div>`;

      document.getElementById('host-results-area').innerHTML = resultHtml;
      document.getElementById('player-results-area').innerHTML = resultHtml;
      document.getElementById('player-action-area').style.display = 'none';
      document.getElementById('player-waiting-msg').style.display = 'none';
    });
  </script>
</body>
</html>
